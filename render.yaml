# The public demo on Render's free plan: one web service from deploy/demo/Dockerfile (storefront, admin panel at
# /admin and File API at /files), with SQLite in a file inside the container. Every restart (the free plan sleeps
# after 15 idle minutes) starts again from the seed data, whose demo accounts are listed in the README.
services:
  - type: web
    name: marketly-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/demo/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars:
      - key: FILE_API_KEY
        generateValue: true
      - key: TZ
        value: Europe/Istanbul
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: PORT
        value: "8080"
